[project]
name = "labs-ida-bridge"
dynamic = ["version"]
description = "Bridge between AI agents and IDA Pro -- execute IDAPython and SQL against live IDA databases"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "apsw>=3.49.0.0",
    "pydantic>=2.6.0",
    "websocket-client>=1.9.0",
    "websockets>=15.0.1",
]

[project.scripts]
ida-bridge = "ida_bridge.cli:main_cli"

[project.entry-points."ida_plugins"]
ida_bridge = "ida_bridge.ida_bridge_plugin"

[dependency-groups]
dev = ["ruff"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Defaults: E4/E7/E9/F. Extra: B=bugbear, I=import sorting, UP=modern Python
extend-select = ["B", "I", "UP"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
